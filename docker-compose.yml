services:
  # Gateway mode. Alloy Navigator credentials arrive per request on
  # X-Alloy-Base-Url, X-Alloy-Client-Id, and X-Alloy-Client-Secret.
  # This service sets no ALLOY_* variables and does not load env_file, so a
  # project .env cannot inject static vendor credentials. Compose interpolates
  # CONDUIT_S2S_SECRET from the environment. For AUTH_MODE=env, pass ALLOY_*
  # on that process instead (see the README).
  alloy-navigator-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
